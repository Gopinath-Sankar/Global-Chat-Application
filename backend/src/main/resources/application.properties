# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8080
spring.application.name=chat-backend

# ---------------------------------------------------------------
# Database: H2 in FILE mode (data survives restarts).
# The database file is created at backend/data/chatdb.mv.db
# To use MySQL/PostgreSQL instead, see README section "Switching the database".
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/chatdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/chatdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------
# Security / JWT
# The secret must be at least 32 characters. Change it for any real deployment
# (or set the environment variable APP_JWT_SECRET).
# ---------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-to-something-long-and-random-1234567890}
app.jwt.expiration-minutes=1440

# Frontend origin(s) allowed to call the API (comma separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://global-chat-application.vercel.app,https://*.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------
# LIVE status: a user is LIVE while their chat screen keeps sending
# heartbeats. If no heartbeat/message arrives within this many seconds,
# the LIVE badge is removed (they stay "online" while connected).
# ---------------------------------------------------------------
app.presence.live-timeout-seconds=45

logging.level.com.chatapp=INFO
